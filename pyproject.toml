[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-frame"
version = "1.0.0b11"
description = "Black Diamond Hub app: family and guest photos on Samsung Frame TVs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk[qr]>=0.45,<1",
    "samsungtvws>=3.0",
    "Pillow>=10",
    "requests>=2.28",
]

[project.urls]
Source = "https://github.com/blackdiamondhub/bdh-app-frame"

[project.entry-points."blackdiamondhub.plugins"]
frame = "frame.plugin:spec"

[tool.setuptools.packages.find]
include = ["frame", "frame.*"]

[tool.setuptools.package-data]
frame = [
    "templates/**/*",
    "static/**/*",
]
