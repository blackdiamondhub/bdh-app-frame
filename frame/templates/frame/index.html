{% extends "base.html" %}
{% load static %}

{% block title %}Frame{% endblock %}
{% block body_class %}fr-page{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'frame/frame.css' %}">
{% endblock %}

{% block content %}
<div class="fr" id="fr"
     data-state-url="{% url 'frame_state' %}"
     data-upload-url="{% url 'frame_upload' %}"
     data-photo-url="{% url 'frame_photo' 'PHOTO' %}"
     data-stay-url="{% url 'frame_stay' %}"
     data-qr-url="{% url 'frame_qr' %}"
     data-csrf="{{ csrf_token }}">
  <div class="fr-loading" id="fr-loading"><i class="fa-regular fa-image"></i><p>Loading…</p></div>
  <div id="fr-view"></div>
  <input type="file" id="fr-file" accept="image/*" multiple hidden>
  <div class="fr-modal" id="fr-modal" hidden><div class="fr-modal-card" id="fr-modal-card"></div></div>
  <div class="fr-toast" id="fr-toast" role="status"></div>
</div>
<script src="{% static 'frame/frame-core.js' %}"></script>
<script src="{% static 'frame/frame.js' %}"></script>
{% endblock %}
